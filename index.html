<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yashnarbek G'ofirjonov's Portfolio</title>
<meta name="description" content="Yashnarbek G'ofirjonov: 17, from Asaka, Uzbekistan. Self-taught developer and coding teacher, heading into Computer Science and cybersecurity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- All text, links, colors and features come from content.json. Edit them in the admin panel: /admin -->
<style>
  :root {
    --bg: #000000;
    --fg: #ffebcd;
    --accent: #5abb9a;
    --muted: #b5a68f;
    --pink: #f4a3b4;
    --line: rgba(90, 187, 154, 0.18);
    --card-border: rgba(90, 187, 154, 0.3);
    --card-border-soft: rgba(90, 187, 154, 0.14);
    --card-bg: rgba(255, 235, 205, 0.03);
    --panel: #0b0b0b;
    --panel-border: #2a2a2a;
    --scan-hi: #9ff5d4;
    --scan-glow: rgba(90, 187, 154, 0.8);
    --fs-base: 19px;
    --fs: var(--fs-base);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: var(--fs); line-height: 1.55; min-height: 100vh; }
  ::selection { background: var(--accent); color: var(--bg); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--fg); border-radius: 3px; }
  html { scrollbar-color: var(--fg) var(--bg); scrollbar-width: thin; }

  .term { padding: 26px 40px 80px; min-height: 100vh; cursor: text; }
  pre { margin: 0; font-family: inherit; }
  p { margin: 0 0 10px; }
  h3 { font-size: 1.17em; margin: 24px 0 10px; font-weight: 700; }
  a { color: var(--accent); text-underline-offset: 3px; }
  .acc { color: var(--accent); }
  .muted { color: var(--muted); }
  .pink { color: var(--pink); }
  .block { margin: 0 0 20px; }
  .rv { animation: rise .4s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* boot screen */
  .boot { font-size: .85em; line-height: 1.6; margin: 0 0 12px; }
  .boot .ok { color: var(--accent); font-weight: 700; }
  .boot .dim { color: var(--muted); }
  .cursor::after { content: "▌"; color: var(--fg); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .skip { position: fixed; right: 18px; bottom: 14px; font-size: 12px; color: var(--muted); opacity: .7; }

  .cmd { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font: inherit; text-align: left; }
  .cmd:hover, .cmd:focus-visible { text-decoration: underline; outline: none; }
  .cmd.on { color: var(--bg); background: var(--accent); border-radius: 4px; padding: 0 4px; }
  .cmdlist { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .cmdrow { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }

  /* home */
  .hero {
    display: grid; max-width: 1280px; gap: 0 48px; align-items: start;
    grid-template-columns: minmax(0, 1fr) minmax(340px, 520px);
    grid-template-areas: "intro art" "cmds art";
  }
  .hero.noart { grid-template-columns: minmax(0, 1fr); grid-template-areas: "intro" "cmds"; }
  .hero .intro { grid-area: intro; }
  .hero .cmds { grid-area: cmds; }
  .hero .art { grid-area: art; position: relative; }
  .banner { color: var(--accent); font-size: 1.05em; line-height: 1.2; margin: 6px 0 24px; min-height: 8.4em; }
  .banner.empty { min-height: 0; margin: 0; }
  .typed { min-height: 1.55em; }
  .typed::after { content: "▌"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  .typed.done::after { content: ""; }
  .art { opacity: 0; transition: opacity 1.6s ease, transform 1.6s ease; transform: scale(.96); }
  .art.on { opacity: 1; transform: none; }

  canvas.portrait { display: block; width: 100%; touch-action: pan-y; cursor: grab; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; opacity: .6; margin-top: 2px; }

  /* prompt */
  .prompt { white-space: nowrap; font-weight: 700; }
  .prompt .u { color: var(--accent); }
  .echo { margin: 0 0 14px; scroll-margin-top: 18px; }
  .input-row { display: flex; align-items: baseline; gap: 1ch; }
  .input-row[hidden] { display: none; }
  #cmd { flex: 1; min-width: 6ch; background: transparent; border: 0; outline: none; color: var(--fg); font: inherit; caret-color: var(--fg); padding: 0; }
  .enter-hint { color: var(--muted); font-size: .8em; animation: blink 1.1s steps(1) infinite; white-space: nowrap; }

  /* cards */
  .card { max-width: 1240px; border: 1.5px solid var(--card-border); border-radius: 18px; padding: 30px 30px 22px; background: var(--card-bg); }
  .name { font-size: 1.7em; font-weight: 700; line-height: 1.2; }
  .tag { color: var(--muted); margin: 6px 0 18px; }
  .beat { display: grid; grid-template-columns: 3ch 11ch minmax(0, 1fr); gap: 0 2ch; padding: 14px 0; border-top: 1px dashed var(--line); }
  .beat .n { color: var(--muted); }
  .beat .lbl { color: var(--accent); font-weight: 700; }
  .beat p { margin: 0; }
  .next { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }

  .grid { max-width: 1240px; columns: 2 460px; column-gap: 28px; }
  .pcard { break-inside: avoid; display: inline-block; width: 100%; margin: 0 0 28px; border: 1.5px solid var(--card-border-soft); border-radius: 18px; padding: 22px 22px; background: var(--card-bg); }
  .pcard.featured { border-color: var(--card-border); }
  .preview { border: 1px solid var(--panel-border); border-radius: 10px; background: var(--panel); padding: 10px 12px 18px; margin-bottom: 16px; font-size: 14px; overflow: hidden; }
  .preview img { display: block; width: 100%; border-radius: 6px; }
  a.preview { display: block; color: inherit; text-decoration: none; transition: border-color .2s; }
  a.preview:hover { border-color: var(--accent); }
  .dots span { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dots span:nth-child(1) { background: #ff5f57; } .dots span:nth-child(2) { background: #febc2e; } .dots span:nth-child(3) { background: #28c840; }
  .preview .path { color: var(--muted); margin-top: 10px; }
  .preview .big { color: var(--fg); font-weight: 700; font-size: 20px; margin-top: 6px; word-break: break-word; }
  .badge { display: inline-block; font-size: .7em; color: var(--bg); background: var(--accent); border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.draft { background: var(--muted); }
  .pcard .title { color: var(--accent); font-weight: 700; font-size: 1.3em; line-height: 1.25; margin-bottom: 6px; }
  .pcard .title a.tlink { color: var(--accent); text-decoration: none; }
  .pcard .title a.tlink:hover { text-decoration: underline; }
  .pcard .tech { color: var(--muted); font-size: .85em; margin-bottom: 8px; }
  .pcard .repo { margin-top: 10px; font-size: .85em; }
  .icons { display: flex; gap: 12px; margin-top: 12px; }
  .icons a { display: inline-flex; width: 32px; height: 32px; border-radius: 50%; background: var(--fg); align-items: center; justify-content: center; }
  .icons svg { width: 18px; height: 18px; fill: var(--bg); }

  .rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 3ch; }
  .rows .k { color: var(--accent); font-weight: 700; }
  .entry { margin: 0 0 20px; }
  .entry .t { color: var(--accent); font-weight: 700; }
  .entry .s { color: var(--muted); font-size: .9em; }
  .copy { margin-left: 1ch; }
  .note { color: var(--muted); font-size: .85em; }

  /* custom commands (simple markup) */
  .md > :last-child { margin-bottom: 0; }
  .md .t { color: var(--accent); font-weight: 700; font-size: 1.1em; margin: 0 0 8px; }
  .md .t:not(:first-child) { margin-top: 18px; }
  .md .rows { margin: 0 0 10px; }
  .md img { display: block; max-width: 100%; border-radius: 10px; margin: 6px 0 12px; }

  /* about: photo decoded like a matrix, top to bottom */
  .about-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 0 34px; align-items: start; }
  .about-grid.nophoto { grid-template-columns: minmax(0, 1fr); }
  .scan { border: 1px solid var(--card-border); border-radius: 6px; padding: 12px; background: var(--bg); font-size: 12px; color: var(--accent); }
  .scan-head { line-height: 1.7; margin-bottom: 8px; }
  .scan-head b { color: var(--fg); font-weight: 400; }
  .scan-box { position: relative; overflow: hidden; aspect-ratio: 3 / 4; background: var(--bg); --p: 0%; }
  .scan-box img { display: block; width: 100%; height: 100%; object-fit: cover; clip-path: inset(0 0 calc(100% - var(--p)) 0); }
  .scan-box .hex { position: absolute; inset: 0; margin: 0; font-size: 11px; line-height: 1.42; letter-spacing: .32em; color: var(--accent);
    white-space: pre; overflow: hidden; clip-path: inset(var(--p) 0 0 0); opacity: .9; }
  .scan-box .line { position: absolute; left: 0; right: 0; top: var(--p); height: 2px; background: var(--scan-hi); box-shadow: 0 0 14px 2px var(--scan-glow); }
  .scan-box.done .hex, .scan-box.done .line { display: none; }
  .scan-status { margin-top: 8px; }
  .chess .acct { padding: 12px 0; border-top: 1px dashed var(--line); }
  .chess .acct:first-of-type { border-top: 0; padding-top: 0; }
  .chess .stats { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 4px; }
  .chess .stats b { color: var(--accent); }

  /* music player */
  .player .head { display: flex; justify-content: space-between; gap: 2ch; margin-bottom: 12px; flex-wrap: wrap; }
  .player .head b { font-size: 1.1em; }
  .track { display: grid; grid-template-columns: 3ch minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 0 2ch; padding: 9px 0; border-top: 1px dashed var(--line); align-items: baseline; }
  .track .n { color: var(--muted); }
  .track .song { font-weight: 700; }
  .track .artist { color: var(--muted); }
  .track .go { display: flex; gap: 12px; white-space: nowrap; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: .9em; margin-right: 1ch; }
  .eq i { width: 3px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; } .eq i:nth-child(4) { animation-delay: .1s; }
  @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }

  .preview-flag { position: fixed; left: 50%; top: 0; transform: translateX(-50%); z-index: 5; background: var(--pink); color: #000; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 0 0 6px 6px; letter-spacing: .08em; }

  @media (prefers-reduced-motion: reduce) { .rv { animation: none; } .art { transition: none; } .typed::after, .cursor::after, .eq i { animation: none; } }
  @media (hover: none) { .hint { display: none; } }
  @media (max-width: 1100px) { :root { --fs: calc(var(--fs-base) * 17 / 19); } .term { padding: 22px 26px 70px; } }
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; grid-template-areas: "intro" "art" "cmds"; }
    .hero.noart { grid-template-areas: "intro" "cmds"; }
    .hero .art { width: min(100%, 360px); justify-self: center; margin: 0 0 8px; }
  }
  @media (max-width: 600px) {
    :root { --fs: calc(var(--fs-base) * 15 / 19); }
    #cmd { font-size: 16px; }
    .term { padding: 16px 14px 60px; }
    .card { padding: 20px 16px 14px; }
    .beat { grid-template-columns: 3ch minmax(0, 1fr); }
    .beat p { grid-column: 1 / -1; margin-top: 4px; }
    .rows { grid-template-columns: 1fr; gap: 2px; }
    .rows .k { margin-top: 10px; }
    .track { grid-template-columns: 3ch minmax(0, 1fr); }
    .track .artist, .track .go { grid-column: 2; }
  }
  @media (max-width: 760px) {
    .about-grid { grid-template-columns: 1fr; }
    .about-grid .scan { width: min(100%, 300px); justify-self: center; margin-bottom: 18px; }
  }
</style>
</head>
<body>
<main class="term" id="term">
  <div id="out" role="log" aria-live="polite"></div>
  <div class="input-row" id="input-row" hidden>
    <label for="cmd" class="prompt"><span class="u" id="prompt-user">yashnarbek@profile</span>:~$</label>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type a command">
    <span class="enter-hint" id="enter-hint" hidden></span>
  </div>
  <noscript>This portfolio is an interactive terminal and needs JavaScript.</noscript>
</main>
<script src="app.js?v=4"></script>
</body>
</html>
